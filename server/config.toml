# Data Smith - Project-level configuration
# Edit this file to switch providers / models without touching code.
# A local override named `config.local.toml` (gitignored) takes precedence
# if present and is merged on top of this file.

[app]
name = "Data Smith API"
version = "1.0.0"
host = "${HOST:-0.0.0.0}"
port = "${PORT:-8000}"
reload = "${RELOAD:-true}"
log_level = "${LOG_LEVEL:-INFO}"

[cors]
# Frontend origins allowed to call the API
origins = [
    "http://localhost:3000",
    "http://127.0.0.1:3000",
    "http://localhost:3001",
    "http://127.0.0.1:3001",
]

[llm]
# Which provider to use: "ollama" (local), "ollama_cloud", or "gemini"
provider = "ollama"
# Sampling temperature applied to every provider
temperature = 0.7

# ----- Ollama (local) -----
[llm.ollama]
model = "${OLLAMA_MODEL:-mistral:7b-instruct}"
base_url = "${OLLAMA_BASE_URL:-http://localhost:11434}"
# Per-request timeout (seconds) for the underlying httpx client. Local
# models can take minutes to emit a full batch of JSON samples.
timeout = "${OLLAMA_TIMEOUT:-600}"

# ----- Ollama Cloud -----
# Ollama's hosted endpoint. base_url should be the host root
# (ChatOllama appends /api/chat itself), e.g. https://ollama.com
[llm.ollama_cloud]
model = "${OLLAMA_CLOUD_MODEL:-mistral:7b-instruct}"
base_url = "${OLLAMA_CLOUD_BASE_URL:-https://ollama.com}"
api_key = "${OLLAMA_CLOUD_API_KEY}"
timeout = "${OLLAMA_CLOUD_TIMEOUT:-600}"

# ----- Google Gemini -----
[llm.gemini]
model = "${GEMINI_MODEL:-gemini-1.5-flash}"
# API key is read from the GEMINI_API_KEY env var (see .env.example).
# Do NOT hardcode secrets here.
api_key = "${GEMINI_API_KEY}"
timeout = "${GEMINI_TIMEOUT:-600}"

# ============================================================
# Generation tuning
# All dataset-generation knobs live here so code changes are
# not required to tune throughput / quality / latency.
# ============================================================
[generation]
# How many samples to ask the LLM for in a single call. Smaller batches
# produce output faster and more reliably; a local 7B model can stall or
# truncate when asked for a large JSON array in one shot.
batch_size = 10
# Cap on the source text fed to the model per call (characters).
source_char_limit = 12000
# Maximum number of LLM calls to run concurrently. Local Ollama usually
# serves one request at a time; raise this for cloud / multi-instance
# backends.
max_concurrency = 1
# Per-LLM-call timeout in seconds. Must be >= the underlying client
# timeout (see model_factory ollama timeout) so our wait_for doesn't
# fire first and mask the real error. Local models can take minutes
# per batch.
llm_timeout = 600
# Extra batch attempts beyond the minimum, to compensate for duplicates
# / under-generation. The total attempts = ceil(num_samples / batch_size)
# + extra_attempts.
extra_attempts = 3
# (QualityAgent) Max revise rounds per flagged sample before we accept
# the latest revision (or drop the sample).
max_revise_rounds = 2

# ============================================================
# Research agent tuning
# The multi-agent research pipeline (planner / researcher / gap /
# quality / writer) uses these knobs.
# ============================================================
[research]
# How many research questions the planner produces (also caps total
# web searches across plan + gap follow-ups).
max_searches = 6
# How many gap (follow-up) rounds to run after the first research pass.
max_gap_rounds = 1
# Snippets to fetch per web_search call.
snippets_per_query = 3
# Per-LLM-call timeout for the research agents, in seconds.
llm_timeout = 600